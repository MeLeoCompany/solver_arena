services:
  backend:
    build:
      context: ./backend
      args:
        # Без GPU по умолчанию — работает на любой машине. Для сборки с
        # cuOpt/CUDA используйте docker-compose.gpu.yml (см. deploy/README.md).
        INSTALL_CUOPT: "false"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Персистентные — иначе при каждом пересоздании контейнера сертификат
      # запрашивался бы заново и можно упереться в лимиты Let's Encrypt.
      - ./deploy/letsencrypt:/etc/letsencrypt
      - ./deploy/certbot-webroot:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped
