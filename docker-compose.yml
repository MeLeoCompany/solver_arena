services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Персистентные — иначе при каждом пересоздании контейнера сертификат
      # запрашивался бы заново и можно упереться в лимиты Let's Encrypt.
      - ./deploy/letsencrypt:/etc/letsencrypt
      - ./deploy/certbot-webroot:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped
