[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solver-arena"
version = "0.1.0"
description = "HTTP server for running and comparing optimization solvers (cuOpt, CPLEX and future backends)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "pydantic-settings",
    "python-multipart",
    "bcrypt",
    "anyio",
    "numpy",
    "cuopt-cu13",
    "reportlab",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx2"]

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]
namespaces = true

[tool.setuptools.package-data]
migrations = ["*.mako", "README"]
"*" = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
