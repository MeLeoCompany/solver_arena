[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solver-arena"
version = "0.1.0"
description = "HTTP server for running and comparing optimization solvers (cuOpt, CPLEX and future backends)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "pydantic-settings",
    "python-multipart",
    "bcrypt",
    "anyio",
    "numpy",
    "reportlab",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx2"]
# Split out so a GPU-less deploy can skip it entirely — it's a multi-GB
# CUDA/RAPIDS dependency chain (cudf, cupy, etc.) that only cuOpt needs;
# CPLEX/ALGLIB/QORE don't touch it. See backend/Dockerfile's INSTALL_CUOPT
# build arg.
cuopt = ["cuopt-cu13==26.8.*"]

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]
namespaces = true

[tool.setuptools.package-data]
migrations = ["*.mako", "README"]
"*" = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
