server {
    listen 80;
    server_name _;

    # MPS-файлы и особенно zip-архивы батчей легко превышают дефолтный
    # 1m — без этого загрузка большого файла падает с "413 Request Entity
    # Too Large" ещё на nginx, не доходя до бэкенда.
    client_max_body_size 500m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router handles routing client-side, so any path
    # that isn't a real static file (or one of the API prefixes below)
    # falls through to index.html.
    location / {
        try_files $uri /index.html;
    }

    # API prefixes — mirrors the dev-time proxy list in
    # frontend/vite.config.ts and the top-level routers in
    # backend/app/api/*.py. Every backend route lives under exactly one of
    # these eight prefixes; nothing else should be proxied.
    #
    # Several of these prefixes are also SPA page paths (/solve, /compare,
    # /batches/new, /batches/:id, ...) — a plain regex match here would
    # swallow full-page GETs for those paths too (e.g. hitting F5 on
    # /batches/new forwards to the backend, which parses "new" as a batch_id
    # and returns a JSON 404 instead of the page). Browser navigations send
    # `Accept: text/html...` first; our own frontend/src/api/client.ts calls
    # don't — so hand html-accepting requests back to the SPA fallback above
    # and only proxy actual API calls.
    location ~ ^/(auth|batches|compare|jobs|solve|solvers|system|users|qore-versions)(/|$) {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /jobs/*/logs, /batches/*/logs and /system/status/stream are
        # text/event-stream (SSE) — nginx buffers proxied responses by
        # default, which would turn live-streamed logs/status into one
        # chunk delivered at the end instead of a real-time stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
